name: etichette_margherita
description: "Etichette Margherita: archivio etichette, lotti interni e stampa."
publish_to: "none"
# La CI sovrascrive versione e build (--build-name/--build-number).
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.6
  image_picker: ^1.2.3
  # Scanner (25/10/2026): fotocamera nell'app, lettura del testo sul
  # telefono (solo Android) e riduzione della foto a 2400 px.
  camera: ^0.11.1
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.2
  image: ^4.5.4
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0
  device_info_plus: ^13.3.0
  web: ^1.1.1
  # Icone Material Symbols arrotondate (4/10/2026): nella build restano
  # solo quelle usate.
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Plus Jakarta Sans (licenza OFL, assets/fonts/OFL.txt), ridotto ai
  # caratteri latini: ~58 KB per peso.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
