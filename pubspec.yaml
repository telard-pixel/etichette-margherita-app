name: etichette_margherita
description: "Etichette Margherita: archivio etichette, lotti interni e stampa."
publish_to: "none"
# La CI sovrascrive versione e build (--build-name/--build-number).
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.3
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  package_info_plus: ^10.2.2
  open_filex: ^4.7.0
  device_info_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
