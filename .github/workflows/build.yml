name: Build APK

on:
  # Ogni ramo viene compilato e controllato; solo main pubblica l'APK
  # (Release su GitHub e caricamento sul server, da cui l'app si aggiorna).
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

# Una build alla volta per ramo: due push ravvicinati non devono finire in
# ordine sbagliato e ricaricare sul server una versione piu' vecchia (il
# server comunque rifiuta le build piu' vecchie; revisione 6/10/2026).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Numero di versione
        run: |
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: File Android mancanti
        # Il progetto tiene solo i file Android personalizzati (manifest):
        # il resto lo genera flutter create, che non tocca i file esistenti.
        run: |
          flutter create --org it.margherita --project-name etichette_margherita --platforms android,web .
          python3 tool/web_tweak.py
          # Versione minima di Android scritta qui, non lasciata a flutter
          # create: un aggiornamento di Flutter la cambiava senza avvisare.
          sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          grep -q "minSdk = 24" android/app/build.gradle.kts

      - run: flutter pub get

      - name: Controllo del codice
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Compila
        # Solo telefoni veri (ARM 32 e 64 bit): niente x86_64 degli emulatori.
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-name "$VERSION" --build-number "$BUILD"

      # La stessa app per il browser: servita dal server su /app/.
      - name: Compila web
        run: |
          # --wasm: motore grafico WebAssembly (skwasm), piu' fluido; i browser
          # che non lo supportano usano da soli la versione JavaScript.
          flutter build web --wasm --release --base-href /app/ --no-web-resources-cdn --build-name "$VERSION" --build-number "$BUILD"
          tar -czf "EtichetteMargherita-web-$VERSION.tgz" -C build/web .
          ls -l "EtichetteMargherita-web-$VERSION.tgz"

      - name: Firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias etichette --ks-pass env:KEYSTORE_PASSWORD \
            --out "EtichetteMargherita-$VERSION.apk" build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "EtichetteMargherita-$VERSION.apk" | head -3
          rm "$RUNNER_TEMP/release.p12"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "EtichetteMargherita-$VERSION.apk"
          ls -l "EtichetteMargherita-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EtichetteMargherita-${{ env.VERSION }}
          path: |
            EtichetteMargherita-*.apk
            EtichetteMargherita-web-*.tgz

      # Prima sul server (e' da li' che l'app si aggiorna), poi la release:
      # se il caricamento fallisce, "Re-run" lo rifa' senza inciampare in una
      # release gia' creata.
      - name: Carica sul server
        if: github.ref == 'refs/heads/main'
        env:
          UPLOAD_TOKEN: ${{ secrets.APP_UPLOAD_TOKEN }}
        run: |
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            -H "X-Upload-Token: $UPLOAD_TOKEN" \
            -F "build=$BUILD" -F "versione=$VERSION" \
            -F "apk=@EtichetteMargherita-$VERSION.apk" \
            https://etichette-margherita.duckdns.org/app/api/v1/admin/apk
          curl --fail-with-body -sS --retry 3 --retry-all-errors -X POST \
            -H "X-Upload-Token: $UPLOAD_TOKEN" \
            -F "build=$BUILD" -F "versione=$VERSION" \
            -F "archivio=@EtichetteMargherita-web-$VERSION.tgz" \
            https://etichette-margherita.duckdns.org/app/api/v1/admin/web

      - name: Pubblica release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" EtichetteMargherita-*.apk \
            --title "Etichette Margherita $VERSION" \
            --notes "Si aggiorna da sola dall'app (Altro › Aggiornamento). L'APK è anche qui sotto." \
          || gh release upload "v$VERSION" EtichetteMargherita-*.apk --clobber
