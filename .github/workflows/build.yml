name: Build APK

on:
  # Ogni ramo viene compilato e controllato; solo main pubblica l'APK
  # (Release su GitHub e caricamento sul server, da cui l'app si aggiorna).
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Numero di versione
        run: |
          echo "BUILD=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: File Android mancanti
        # Il progetto tiene solo i file Android personalizzati (manifest):
        # il resto lo genera flutter create, che non tocca i file esistenti.
        run: flutter create --org it.margherita --project-name etichette_margherita --platforms android .

      - run: flutter pub get

      - name: Controllo del codice
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Compila
        run: flutter build apk --release --build-name "$VERSION" --build-number "$BUILD"

      - name: Firma
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-key-alias etichette --ks-pass env:KEYSTORE_PASSWORD \
            --out "EtichetteMargherita-$VERSION.apk" build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "EtichetteMargherita-$VERSION.apk" | head -3
          rm "$RUNNER_TEMP/release.p12"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump permissions "EtichetteMargherita-$VERSION.apk"
          ls -l "EtichetteMargherita-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: EtichetteMargherita-${{ env.VERSION }}
          path: EtichetteMargherita-*.apk

      - name: Pubblica release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" EtichetteMargherita-*.apk \
            --title "Etichette Margherita $VERSION" \
            --notes "Si aggiorna da sola dall'app (Altro › Aggiornamento). L'APK è anche qui sotto."

      - name: Carica sul server
        if: github.ref == 'refs/heads/main'
        env:
          UPLOAD_TOKEN: ${{ secrets.APP_UPLOAD_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "X-Upload-Token: $UPLOAD_TOKEN" \
            -F "build=$BUILD" -F "versione=$VERSION" \
            -F "apk=@EtichetteMargherita-$VERSION.apk" \
            https://etichette-margherita.duckdns.org/app/api/v1/admin/apk
